services:
  app:
    build: .
    ports:
      - "127.0.0.1:4310:4310"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      APP_ORIGIN: ${APP_ORIGIN:?Set the external HTTPS origin}
      SETUP_TOKEN: ${SETUP_TOKEN:?Set a random installation token}
      TRUST_PROXY: "1"
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-0}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-0}
      BILLING_MODE: ${BILLING_MODE:-open_source}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_ADDITIONAL_PRICE_IDS: ${STRIPE_ADDITIONAL_PRICE_IDS:-}
      CLAMSCAN_PATH: /usr/bin/clamscan
      DATABASE_URL: postgresql://fieldboard:${POSTGRES_PASSWORD:?Set a database password}@db:5432/fieldboard
    volumes:
      - signatures:/var/lib/clamav:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4310/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  scanner:
    build: .
    user: root
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "mkdir -p /var/lib/clamav && chown clamav:clamav /var/lib/clamav && exec freshclam --daemon --foreground --stdout --user=clamav",
      ]
    volumes:
      - signatures:/var/lib/clamav
    restart: unless-stopped
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: fieldboard
      POSTGRES_DB: fieldboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldboard -d fieldboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  signatures:
  postgres:
