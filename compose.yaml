services:
  app:
    build: .
    ports:
      - "127.0.0.1:4310:4310"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      APP_ORIGIN: ${APP_ORIGIN:?Set the external HTTPS origin}
      SETUP_TOKEN: ${SETUP_TOKEN:?Set a random installation token}
      TRUST_PROXY: "1"
      DATABASE_URL: postgresql://fieldboard:${POSTGRES_PASSWORD:?Set a database password}@db:5432/fieldboard
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4310/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: fieldboard
      POSTGRES_DB: fieldboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldboard -d fieldboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres:
